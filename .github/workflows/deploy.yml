name: deploy
on:
  pull_request:
  push:
    branches: [master]

# One production deploy at a time; later pushes queue behind the running one.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Pinned by SHA: this job holds the Netlify token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run lint
      - run: bun run format:check
      # No secrets at build time: every astro:env secret is optional, Netlify hands them to the
      # function at runtime.
      - run: bun run build
      - name: Deploy to Netlify production
        if: github.event_name == 'push'
        run: bunx netlify-cli@27.12.0 deploy --prod --dir=dist --no-build --message "${{ github.sha }}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
